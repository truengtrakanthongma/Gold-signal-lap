name: บอทเฝ้าสัญญาณ (แจ้งเตือนเข้า Discord)

# ทำไมต้องมี: หน้าเว็บต้องเปิดค้างไว้ถึงจะเตือนได้ ปิดจอก็จบ
# ตัวนี้รันบนเครื่องของ GitHub จึงเตือนได้แม้ปิดเครื่องคุณสนิท
#
# ค่าใช้จ่าย: รีโปสาธารณะได้นาทีรันไม่จำกัด — ฟรีทั้งหมด
on:
  schedule:
    # ทุก 15 นาที ให้ตรงกับกรอบเวลาแท่งเทียนที่ใช้
    #
    # ทำไมไม่ใช่ */15 ซึ่งอ่านง่ายกว่า: */15 ลงที่นาที 0/15/30/45 ซึ่งเป็นนาที
    # ที่คนทั้งโลกตั้งกันหนาแน่นที่สุด และเอกสารของ GitHub บอกเองว่าคิวจะช้า
    # ช่วงต้นชั่วโมง เลื่อนมาอยู่นาทีที่ไม่มีใครแย่งจึงมีโอกาสได้รันตรงเวลากว่า
    #
    # ตัวตั้งเวลาของ GitHub ไม่รับประกันความตรงเวลาอยู่ดี ช่วงคนใช้เยอะอาจช้า
    # หรือข้ามรอบไปเลย จึงเหมาะกับกรอบ 15 นาทีขึ้นไป ไม่เหมาะกับการเก็งกำไรรายนาที
    - cron: '3,18,33,48 * * * *'

    # ตัวสำรอง + ตัวทดลอง: รอบละชั่วโมง
    #
    # ตัวตั้งเวลาไม่ยอมรันเลยตลอด 6 ชั่วโมงแรก ทั้งที่ตั้งค่าถูกทุกอย่าง
    # ข้อสันนิษฐานหนึ่งคือคิวงานถี่ ๆ ถูกลดความสำคัญมากกว่างานที่นาน ๆ ครั้ง
    # ถ้าบรรทัดนี้รันแต่บรรทัดบนไม่รัน ก็รู้ทันทีว่าเป็นเรื่องความถี่
    # ถ้าไม่รันทั้งคู่ ก็รู้ว่าไม่ใช่เรื่องความถี่ และตัดสมมติฐานนี้ทิ้งได้
    #
    # ระหว่างนี้มันทำหน้าที่สำรองไปด้วย เตือนชั่วโมงละครั้งยังดีกว่าไม่เตือนเลย
    # ไม่ต้องกลัวเตือนซ้ำ เพราะบอทจำแท่งที่เตือนไปแล้วและข้ามให้เอง
    - cron: '7 * * * *'
  workflow_dispatch:      # กดรันเองได้ตลอด ใช้ตอนทดสอบ
    inputs:
      dry_run:
        description: 'ดูว่าเอนจินคิดอะไร โดยไม่ส่งอะไรเข้า Discord เลย (อย่าติ๊กคู่กับ test ping)'
        type: boolean
        default: false
      test_ping:
        description: 'ส่งข้อความทดสอบเข้า Discord จริง เพื่อเช็กว่าใส่ webhook ถูก — ติ๊กช่องนี้ช่องเดียว'
        type: boolean
        default: false

# กันไม่ให้รันซ้อนกันเมื่อรอบก่อนยังไม่จบ
concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ด่านกันเสียเงิน: นาทีรันฟรีไม่จำกัดเฉพาะรีโปสาธารณะ
      # ถ้าวันไหนรีโปถูกเปลี่ยนเป็นส่วนตัว ให้หยุดตั้งแต่ยังไม่ทำงาน
      # ถามสถานะจริงจาก API ทุกครั้ง ไม่เดาจากข้อมูลในเหตุการณ์ที่อาจไม่มีมาให้
      # ถามไม่ได้ก็ถือว่าไม่ปลอดภัยแล้วหยุด ดีกว่าปล่อยรันแล้วมารู้ทีหลัง
      - name: กันเสียเงิน — รันต่อเฉพาะเมื่อรีโปเป็นสาธารณะ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vis=$(curl -sS --fail --max-time 20 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" \
                | jq -r '.visibility // empty')
          if [ "$vis" = "public" ]; then
            echo "รีโปเป็นสาธารณะ — นาทีรันฟรี ทำงานต่อได้"
          else
            echo "::error::รีโปไม่ได้เป็นสาธารณะ (อ่านค่าได้ '${vis:-อ่านไม่ได้}') จึงหยุดบอทไว้ก่อน"
            echo "รีโปส่วนตัวมีนาทีฟรีจำกัด บอทนี้รัน 96 รอบ/วันจะใช้หมดเร็ว"
            echo "ถ้าอยากรันต่อ ให้เปลี่ยนรีโปกลับเป็นสาธารณะ หรือปิดตารางเวลาในไฟล์นี้"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # จำว่าเตือนแท่งไหนไปแล้ว กันเตือนซ้ำเมื่อตัวตั้งเวลารันช้าจนคาบเกี่ยวกัน
      # คีย์ของแคชแก้ไม่ได้ จึงตั้งคีย์ใหม่ทุกรอบ แล้วกู้คืนด้วยคำนำหน้าแทน
      - name: กู้คืนสถานะรอบก่อน
        uses: actions/cache/restore@v4
        with:
          path: bot/.state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: ตรวจว่าเอนจินยังผ่านเทสต์ก่อนเชื่อสัญญาณ
        run: node test/run-tests.mjs

      - name: เฝ้าสัญญาณ
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          BOT_TEST_PING: ${{ inputs.test_ping && '1' || '0' }}
          # ปรับได้จาก Settings → Secrets and variables → Actions → Variables
          BOT_INTERVAL: ${{ vars.BOT_INTERVAL || '15m' }}
          BOT_THRESHOLD: ${{ vars.BOT_THRESHOLD || '45' }}
          BOT_ACCOUNT: ${{ vars.BOT_ACCOUNT || '1000' }}
          BOT_RISK_PCT: ${{ vars.BOT_RISK_PCT || '1' }}
          BOT_SOURCES: ${{ vars.BOT_SOURCES || 'kraken_paxg,bitfinex_xaut,binance_paxg,okx_paxg' }}
        run: node bot/run.mjs

      # เตือนเฉพาะตอนมีอะไรให้เตือนจริง: รอบที่ไม่ได้เขียนไฟล์สถานะ (ทดสอบ หรือ
      # คะแนนไม่ถึงเกณฑ์) เคยขึ้น "Cache save failed" ทุกครั้งทั้งที่ไม่มีอะไรผิด
      # คำเตือนที่ขึ้นตลอดสอนให้คนเลิกอ่านคำเตือน ซึ่งอันตรายกว่าไม่มีคำเตือนเลย
      - name: บันทึกสถานะไว้ใช้รอบถัดไป
        if: always() && hashFiles('bot/.state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: bot/.state.json
          key: bot-state-${{ github.run_id }}
